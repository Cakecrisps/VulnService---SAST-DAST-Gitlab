stages:
  - sast
  - build
  - dast

default:
  tags:
    - docker

# Общие настройки заданий, которым нужен Docker daemon.
.docker_job:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    HEALTHCHECK_TCP_PORT: "2375"
  before_script:
    - docker info
    - docker compose version

sast:
  stage: sast
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]
  script:
    - mkdir -p scan-results
    - >
      semgrep scan
      --config p/python
      --config test_ruels.yml
      --metrics=off
      --json
      --output scan-results/semgrep.json
      main.py
  artifacts:
    when: always
    paths:
      - scan-results/semgrep.json
    expire_in: 7 days

build:
  extends: .docker_job
  stage: build
  script:
    - docker build -t "vulnservice:$CI_COMMIT_SHA" .
    - docker save -o vulnservice.tar "vulnservice:$CI_COMMIT_SHA"
  artifacts:
    paths:
      - vulnservice.tar
    expire_in: 1 day

dast:
  extends: .docker_job
  stage: dast
  dependencies:
    - build
  variables:
    COMPOSE_PROJECT_NAME: "vulnservice-ci-${CI_JOB_ID}"
    ZAP_CONTAINER: "zap-scan-${CI_JOB_ID}"
    ZAP_VOLUME: "zap-reports-${CI_JOB_ID}"
  script:
    - |
      set -eu
      mkdir -p scan-results/zap

      # Образ из build загружаем в отдельный Docker daemon задания DAST.
      docker load -i vulnservice.tar
      docker compose -f compose.yaml -f compose.ci.yaml up \
        -d --no-build --wait --wait-timeout 120

      # Токены живут в памяти приложения: получаем новый после запуска.
      TOKEN=$(docker compose -f compose.yaml -f compose.ci.yaml exec -T app \
        python -c 'import json, urllib.request; request = urllib.request.Request("http://127.0.0.1:8000/login", data=json.dumps({"username": "alice", "password": "alice"}).encode(), headers={"Content-Type": "application/json"}); response = urllib.request.urlopen(request, timeout=10); print(json.load(response)["access_token"])')
      test -n "$TOKEN"

      # Создаём volume внутри Docker daemon сервиса DinD.
      docker volume create "$ZAP_VOLUME"

      # Даём пользователю ZAP право записывать отчёты.
      docker run --rm \
        -v "$ZAP_VOLUME:/reports" \
        alpine:3.22 \
        chmod 777 /reports

      docker create \
        --name "$ZAP_CONTAINER" \
        --network "${COMPOSE_PROJECT_NAME}_default" \
        -v "$ZAP_VOLUME:/zap/wrk:rw" \
        -e ZAP_AUTH_HEADER=Authorization \
        -e "ZAP_AUTH_HEADER_VALUE=Bearer $TOKEN" \
        -e ZAP_AUTH_HEADER_SITE=vuln-app \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-api-scan.py \
          -t http://vuln-app:8000/openapi.json \
          -f openapi \
          -r report.html \
          -J report.json

      ZAP_EXIT=0
      docker start -a "$ZAP_CONTAINER" || ZAP_EXIT=$?

      # При ошибке сканера останавливаемся до копирования отчётов.
      case "$ZAP_EXIT" in
        0|1|2) ;;
        *) exit "$ZAP_EXIT" ;;
      esac

      docker cp "$ZAP_CONTAINER:/zap/wrk/report.html" \
        scan-results/zap/report.html
      docker cp "$ZAP_CONTAINER:/zap/wrk/report.json" \
        scan-results/zap/report.json

      echo "ZAP completed with exit code $ZAP_EXIT"
      case "$ZAP_EXIT" in
        0) echo "ZAP scan completed without alerts" ;;
        1|2) echo "ZAP scan completed with findings" ;;
        *) exit "$ZAP_EXIT" ;;
      esac
  after_script:
    - mkdir -p scan-results
    - docker compose -f compose.yaml -f compose.ci.yaml logs --no-color > scan-results/compose.log 2>&1 || true
    - docker rm -f "$ZAP_CONTAINER" || true
    - docker compose -f compose.yaml -f compose.ci.yaml down -v || true
    - docker volume rm "$ZAP_VOLUME" || true
  artifacts:
    when: always
    paths:
      - scan-results/
    expire_in: 7 days
